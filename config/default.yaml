gateway:
  listen: "0.0.0.0:8080"
  request_timeout_ms: 60000
  max_body_bytes: 52428800       # 50 MiB
  shutdown_timeout_ms: 15000

logging:
  level: "info"
  format: "pretty"

upstream_allowlist:
  hosts:
    - "api.openai.com"
    - "127.0.0.1"

defaults:
  rate_limit:
    algorithm: "token_bucket"
    rps: 10
    burst: 20
  breaker:
    failure_threshold: 5
    open_duration_ms: 30000

# SSRF 运行时防护：默认严格拦截回环/私有/链路本地 IP。
# 下面的 ssrf.allow_list 如需豁免某个 host，可在此显式列出。
# 注意：upstream_allowlist.hosts 中的 "127.0.0.1" 仅用于配置文件校验，
# 运行时 SSRF 由下方 ssrf 段管控（默认严格拦截回环地址）。
ssrf: {}

# Example upstream configuration (uncomment and fill in to use):
# upstreams:
#   - id: "openai-main"
#     provider: "openai"
#     base_url: "https://api.openai.com/v1"
#     api_key: "${RGD_OPENAI_API_KEY}"
#     timeout_ms: 30000           # Per-upstream timeout (overrides global)
#     pool:
#       idle_timeout_secs: 120    # Connection idle timeout
#       max_idle_per_host: 20     # Max idle connections per host
#     models:
#       - "gpt-4"
#       - "gpt-3.5-turbo"
upstreams: []
