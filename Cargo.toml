[package]
name = "rapidgate"
# 注：cargo semver 不接受 minor 段前导零，spec AGENTS.md §6 写 "2026.09.1" 会在
# `cargo check` 时报 "invalid leading zero"。这里用 2026.9.1 与 2026.9.x 系列等价。
version = "2026.9.1"
edition = "2021"
default-run = "rapidgate"
license = "Apache-2.0"
description = "High-performance unified LLM API gateway written in Rust"
repository = "https://github.com/SharkMI-0x7E/RapidGate"
# AI 工作产物（claude.md / 分阶段作业提示词 / 阶段三任务书）不进入发布包：
# 只影响 cargo package 内容，不影响工作区文件，也不重写 git 历史。
exclude = [
    "claude.md",
    "docs/rapidgate-prompt.md",
    "docs/rapidgate-stage3.md",
]

[lib]
name = "rapidgate"
path = "src/lib.rs"

[[bin]]
name = "rapidgate"
path = "src/main.rs"

[features]
# ETCD 配置中心后端（需要 protoc + etcd-client）。默认关闭。
config-center-etcd = ["dep:etcd-client"]

[dependencies]
# 异步运行时（spec §3.1 锁定）
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal"] }

# HTTP 框架（spec §3.1 锁定）
axum = { version = "0.8", features = ["macros", "ws"] }

# HTTP 客户端（spec §3.1 锁定，关闭默认 features 以避免 openssl 依赖）
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# 序列化（spec §3.1 锁定）
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# 配置（spec §3.1 锁定）
dotenvy = "0.15"

# 日志（spec §3.1 锁定）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 错误处理（spec §3.1 锁定）
thiserror = "2.0"
anyhow = "1.0"

# 工具（spec §3.1 锁定）
bytes = "1.10"
http = "1.2"
http-body-util = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
arc-swap = "1.7"
notify = "6.1"
moka = { version = "0.12", features = ["future"] }
sha2 = "0.10"
subtle = "2.6"
regex = "1.11"
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "util"] }
hyper = { version = "1.5", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "client", "tokio"] }
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = "0.29"

# 阶段二新增（spec §3.2）
jsonwebtoken = "9.3"         # JWT 认证
serde_with = "3.7"           # 审计日志结构化

# 阶段三新增（spec §3.3）
rand = "0.8"                 # 随机数生成（灰度策略）
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "cluster"] }  # 分布式限流
prometheus = "0.14"          # Prometheus 指标导出
tracing-opentelemetry = "0.28"  # OpenTelemetry tracing
opentelemetry = { version = "0.27", features = ["trace", "metrics"] }  # OpenTelemetry SDK
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }  # OTLP 导出
opentelemetry_sdk = { version = "0.27", features = ["trace", "metrics", "rt-tokio"] }  # OpenTelemetry SDK
# ETCD 配置中心 - feature-gated（config-center-etcd）。需要 protoc + etcd-client 编译
etcd-client = { version = "0.12", optional = true }
libloading = "0.8"           # Native 插件动态库加载（dlsym）
wasmtime = "19.0"            # WASM 插件沙箱
async-graphql = "7.0"        # GraphQL（admin API）# 计划中：GraphQL admin（spec §3.3 保留）
async-graphql-axum = "7.0"   # GraphQL axum 集成 # 计划中：GraphQL admin（spec §3.3 保留）
oauth2 = "4.4"               # OAuth2 认证
clap = { version = "4.5", features = ["derive"] }  # CLI 参数解析

[dev-dependencies]
# 集成测试辅助
tokio = { version = "1.42", features = ["macros", "rt", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }  # 基准测试（spec §3.2）
# goose = "0.16"               # 负载测试（spec §3.3）- 暂时移除，与 tokio 1.42 冲突

[[bench]]
name = "routing_bench"
harness = false

[[bench]]
name = "proxy_bench"
harness = false
