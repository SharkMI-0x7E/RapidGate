name: Release

# 触发条件：
# 1. 推送 main 分支且 Cargo.toml 变更 → 自动读取 version 打 tag → 触发构建
# 2. 手动推送 v* tag → 直接触发构建（应急通道）
on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 阶段 1：仅在 push to main 时运行，从 Cargo.toml 读 version 并自动打 tag
  # 手动推送 v* tag 时此 job 会被跳过（if 条件过滤），直接走构建
  auto-tag:
    name: Auto Tag from Cargo.toml
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Extract version from Cargo.toml
        id: extract
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "::error::Cannot extract version from Cargo.toml"
            exit 1
          fi
          # 版本号格式校验：YYYY.MM.N（年份 4 位、月份 1-12、序号正整数）
          # cargo semver 拒绝 minor 段前导零，实际版本为 2026.9.1 形式（也接受 2026.09.1）
          if ! echo "$VERSION" | grep -Eq '^[0-9]{4}\.(0?[1-9]|1[0-2])\.[0-9]+$'; then
            echo "::error::Invalid version format: '$VERSION'. Expected YYYY.MM.N (e.g. 2026.9.1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION, tag: v$VERSION"
      - name: Check if tag already exists
        id: check
        run: |
          TAG="v${{ steps.extract.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag $TAG already exists on remote, skip tagging and build."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist, will create it."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create and push tag
        if: steps.check.outputs.should-build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.extract.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Pushed tag: $TAG"

  # 阶段 2：构建多平台二进制
  # 触发条件：tag 推送事件 OR auto-tag 成功创建了 tag
  build:
    name: Build ${{ matrix.target }}
    needs: auto-tag
    if: |
      (startsWith(github.ref, 'refs/tags/v')) ||
      (needs.auto-tag.outputs.should-build == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            archive-ext: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            archive-ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            archive-ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            archive-ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            archive-ext: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            archive-ext: zip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@v1 # stable（v1 tag 是官方稳定滚动指针）
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.7
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        id: package
        run: |
          BINARY_NAME="rapidgate${{ matrix.ext }}"
          SOURCE="target/${{ matrix.target }}/release/${BINARY_NAME}"
          STAGING="rapidgate-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "$SOURCE" "$STAGING/"
          if [ "${{ matrix.archive-ext }}" = "tar.gz" ]; then
            tar -czf "${STAGING}.tar.gz" "$STAGING"
            echo "artifact=${STAGING}.tar.gz" >> "$GITHUB_OUTPUT"
          else
            zip -r "${STAGING}.zip" "$STAGING"
            echo "artifact=${STAGING}.zip" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: binary-${{ matrix.target }}
          path: ${{ steps.package.outputs.artifact }}

  # 阶段 3：创建 GitHub Release
  release:
    name: Create Release
    needs: [auto-tag, build]
    if: |
      (startsWith(github.ref, 'refs/tags/v')) ||
      (needs.auto-tag.outputs.should-build == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/download-artifact@cc203385981b70ca67e1cc39263f7d9bd4616c83 # v4.1.9
        with: { path: artifacts }
      - run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-files/ \;
      - run: cd release-files && sha256sum * > SHA256SUMS
      - id: prerelease
        run: |
          # YYYY.MM.N 格式下，序号为 0 或含预发布后缀的视为 pre-release
          VERSION="${GITHUB_REF_NAME#v}"
          # 例如 2026.06.1 → 非 pre-release
          # 例如 2026.06.1-rc.1 → pre-release
          if [[ "$VERSION" == *"-"* ]]; then echo "is-prerelease=true" >> "$GITHUB_OUTPUT";
          else echo "is-prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is-prerelease }}
          files: release-files/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
