name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".trae/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".trae/**"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.7
      - run: cargo fmt -- --check

  version-check:
    name: Version Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Validate Cargo.toml version format (YYYY.MM.N)
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "::error::Cannot extract version from Cargo.toml"
            exit 1
          fi
          # 月份 1-12：接受带前导零（2026.09.1）与不带（2026.9.1）。
          # cargo semver 拒绝 minor 段前导零，故实际发布版本为 2026.9.1 形式。
          if ! echo "$VERSION" | grep -Eq '^[0-9]{4}\.(0?[1-9]|1[0-2])\.[0-9]+$'; then
            echo "::error::Invalid version format: '$VERSION'. Expected YYYY.MM.N (e.g. 2026.9.1)"
            exit 1
          fi
          echo "PASS: version '$VERSION' matches YYYY.MM.N format"

  lint-test:
    name: Clippy & Test (${{ matrix.rust }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        exclude:
          - os: windows-latest
            rust: beta
          - os: macos-latest
            rust: beta
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.7
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --all-targets --all-features
      - run: cargo test --all-features

  unsafe-check:
    name: Unsafe Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Check for unsafe code
        run: |
          # 白名单：src/core/plugins/native.rs 是 dlsym/libloading FFI 边界，
          # 其 unsafe 已评审并文档化（加载期校验必选符号）。其余文件禁止 unsafe。
          if grep -rn "unsafe" src/ --include="*.rs" | grep -v "^src/core/plugins/native.rs:"; then
            echo "::error::Found 'unsafe' keyword outside the whitelisted FFI module!"
            exit 1
          fi
          echo "PASS: No unsafe code outside native plugin FFI module"

  release-build:
    name: Release Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.7
      - run: cargo build --release
